# Conda environment for the siphonophore literature corpus pipeline.
#
# Usage:
#     conda env create -f environment.yaml
#     conda activate corpus
#
# Most Python and system tools (tesseract, ghostscript, pymupdf) come
# from conda-forge. ocrmypdf itself is installed via pip. Its two
# optional native helpers — pngquant and jbig2enc — are not on
# conda-forge for every target platform (notably pngquant is missing
# from osx-arm64), and ocrmypdf runs fine without them at a lower
# optimization level. pipeline/scan.py auto-degrades `--optimize`
# from 2 → 1 when pngquant isn't on PATH and logs a one-line nudge.
# See INSTALL.md for system-install instructions for both.
#
# Tesseract language packs are NOT in conda-forge (the base `tesseract`
# package ships only English LSTM data).  After creating the env, run
# `bash tools/install_tessdata.sh` to drop the default fallback set
# (deu, fra, rus, lat, spa, por, chi_sim, chi_tra, jpn, ell, kor, grc,
# deu_latf) into $CONDA_PREFIX/share/tessdata.  See INSTALL.md.
#
# On HPC (Bouchet / YCRC) the same file works after `module load miniconda`.

name: corpus

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - pip

  # PDF + OCR toolchain (native side)
  - tesseract  # English LSTM data ships with the base package. Other
               # language packs are downloaded by tools/install_tessdata.sh
               # after env creation — none of them are on conda-forge.
  - ghostscript
  # pngquant is ocrmypdf's optional helper for color-PNG quantization
  # (substantial size savings on PDFs with many embedded color images).
  # NOT installed here: it's missing from osx-arm64 conda-forge, and
  # the runtime degrades gracefully without it. Install at the system
  # level if you want the extra compression — see INSTALL.md.
  - pymupdf
  - pandoc    # md → pdf for write-up workflows initiated by Claude (#50)
  - tectonic  # self-contained LaTeX engine so pandoc's LaTeX→PDF path works out of the box (#50); no full TeX Live install

  # Config, data, scientific
  - numpy
  - pillow
  - matplotlib
  - pydantic
  - pyyaml
  - python-dotenv
  - requests
  - rapidfuzz  # fuzzy title matching in biblio-authority builder
  - lxml  # TEI-XML parsing (Grobid output)
  - rich  # operator-facing CLI rendering (#63); also transitive via mcp + anthropic

  # Notebook / interactive dev
  - ipykernel

  # Test runner
  - pytest
  - pyflakes  # static-analysis gate (tests/test_no_undefined_names.py) — catches
              # NameError-class bugs at lint time. Cheap enough to install everywhere.

  # Pip-only packages
  #
  # EVERY pip dep here is pinned exactly (#158). Two of them have already
  # moved under us and broken clean installs while CI stayed green on a
  # cached env — `lancedb` (#71, the 0.30.x list_tables shape change) and
  # `mcp` (#156, the 2.0 removal of mcp.server.fastmcp). The cache key is
  # a hash of this file plus pyproject.toml, so an unpinned dep is never
  # re-resolved by CI and a green badge says nothing about whether
  # `conda env create` works. Pinning makes every bump a deliberate,
  # reviewable commit; the scheduled T3 clean-room lane
  # (.github/workflows/clean-room.yml) is what catches a pin that has
  # gone stale against the wider ecosystem.
  #
  # To bump one: change it here AND in requirements.txt AND in
  # pyproject.toml (CONTRIBUTING.md §"Dependencies — two files, on
  # purpose"), then let T0/T1/T2 and the clean-room lane vote.
  - pip:
      - ocrmypdf==17.8.1  # pinned (#158). Pulls its own Python deps; finds tesseract/ghostscript on PATH from conda.
      - docling==2.94.0  # pinned (#98): docling 2.95/2.96 silently break macOS arm64 (MPS) extraction (empty output, no crash). Move forward deliberately once verified on arm64.
      - lancedb==0.36.0  # pinned (#158) — already broke us once at 0.30.x (#71, list_tables shape change).
      - langdetect==1.0.9  # pinned (#158). Language detection for scan_detection / OCR language selection (Phase C).
      - mcp==2.0.0  # Model Context Protocol SDK for the corpus-serving agent tools
                    # layer. Pinned exactly (#156): 2.0.0 removed
                    # `mcp.server.fastmcp` (FastMCP → MCPServer), so an unpinned
                    # `mcp` silently broke every clean install while CI stayed
                    # green on a cached env. Advance deliberately.
      - uvicorn==0.52.0  # pinned (#158). ASGI server for `corpus serve --transport sse`; declared explicitly so we don't rely on mcp's transitive pin.
      - sentence-transformers==5.5.0  # local embedding backend (Phase E); pulls torch + transformers. Pinned with the docling stack (#98) to keep the known-good set consistent.
      - torch==2.12.0  # pinned (#98) for build reproducibility. Imported directly in pipeline/embeddings.py / pipeline/vision.py. This PyPI build is CUDA 13, which is what Bouchet's driver (580.x / CUDA 13.0) wants — no re-install from a cuXXX index is needed there (issue #21; see dev_docs/BOUCHET.md).
      - transformers==5.8.1  # pinned (#98). Imported directly in pipeline/vision.py for the local VLM backend.
      - anthropic==0.120.2  # pinned (#158). Claude API client for the vision figure-panel backend (pipeline/vision.py).
      - pytesseract==0.3.13  # pinned (#158). Python wrapper for Tesseract — used in Pass 3a figure-label OCR.
      - qwen-vl-utils==0.0.14  # pinned (#158). Image preprocessing for the Qwen2.5-VL local VLM backend (pipeline/vision.py).
      - accelerate==1.14.0  # pinned (#158). HuggingFace device_map / model sharding for local VLM.
