# corpus config.yaml — per-corpuscle settings
#
# Copied here by `corpus init`. Edit the input paths for your corpus,
# leave the system tuning blocks alone unless you have a reason.
# Schema: pipeline/config_schema.py (CorpuscleConfig).
#
# Path resolution: relative paths resolve against the directory
# containing this file (not cwd). So `cd <corpuscle> && corpus run`
# and `corpus --config <corpuscle>/config.yaml run` from anywhere
# give identical results. A leading `~` is expanded to your home
# directory; environment variables ($HOME, $SCRATCH) are NOT — YAML
# has no shell, so write those out in full.

# ---------------------------------------------------------------------------
# Per-corpuscle inputs
# ---------------------------------------------------------------------------

# Directory of PDFs to process (recursively walked). Glob expansion
# is not supported — point at a directory.
input_pdfs: ./pdfs

# Per-corpuscle artifact tree (per-paper directories, cross-paper
# SQLite DBs, LanceDB index). Defaults to ./output if omitted.
output_dir: ./output

# Curated BibTeX file. Records whose `file = {Foo.pdf}` field matches
# an input PDF override Grobid for header metadata. Comment out to
# rely on Grobid's parse for every paper.
# bib: ./references.bib

# Multi-category lexicon YAML (anatomy, biogeography, ...). Each
# top-level key emits its own <hash>/<category>.json artifact.
# Comment out to skip lexicon annotation entirely.
# lexicon: ./lexicon.yaml

# External taxonomy snapshot. Auto-built into <output_dir>/taxonomy.sqlite
# on the first `corpus run`. Three sources to pick from:
#
#   worms — fetch a WoRMS (World Register of Marine Species) subtree by
#           AphiaID. Best for marine groups. Set `source: worms` and
#           `root_id: <AphiaID>` (e.g. 1371 for the order Siphonophorae;
#           look your group up at https://www.marinespecies.org/).
#
#   dwca  — ingest a Darwin Core Archive .zip pulled from GBIF, ITIS, or
#           Catalogue of Life. Set `source: dwca` and `path: <zip>`.
#           Right answer for non-marine groups.
#
#   dwc   — ingest an unzipped Darwin Core directory (rare; use dwca
#           unless you already have a tree of .tsv files on disk).
#
# Leave the block commented out (default) to skip the synonymy graph
# entirely — the pipeline still extracts taxon mentions from text, you
# only lose the link from historical names to current valid names.
#
# When opting in: uncomment ONE of the two blocks below — they are
# alternatives, not a single block to uncomment wholesale. `root_id`
# belongs to `worms` only; `path` belongs to `dwca`/`dwc` only.
# Preserve the exact indentation: `source:` and its sibling key are
# nested under `taxonomy:` and must keep their 2-space indent once the
# leading `# ` is stripped, or YAML reads them as top-level keys and
# the loader errors out.
#
# Local archive — the recommended default. No network at run time, and
# version-pinned rather than tracking a moving upstream.
#
# taxonomy:
#   source: dwca
#   path: ./taxonomy.dwca.zip
#
# WoRMS subtree — needs outbound internet on every fresh corpuscle.
# Prefer building this once, then `corpus taxonomy export -o taxonomy.zip`
# and switching to the `dwca` block above (README §External taxonomic data).
#
# taxonomy:
#   source: worms
#   root_id: 1371                 # Siphonophorae order (example)

# Figure panel-ROI detection (#102).
figures:
  panel_detection: ocr   # one of: ocr (OCR-driven panel ROIs, CPU-only,
                         #             the default floor),
                         #         vision-local (open-weights VLM on CUDA/MPS),
                         #         vision-claude (Anthropic API; needs ANTHROPIC_API_KEY),
                         #         off (no panel-ROI detection)
  # model: claude-sonnet-4-6-20251001   # optional override (vision-* modes)

  # Figure resolution (#121). 'native' (default) renders each figure at its
  # source's native pixel density — a 600-dpi scan figure stays 600 dpi —
  # so resolution varies per figure rather than one hardcoded value.
  resolution_mode: native   # native | fixed
  vector_dpi: 300           # native mode: render DPI for vector figures
                            #   (no native resolution exists). Default 300.
  # max_dpi: 600            # native mode: optional ceiling for dense scans.
  # images_scale: 2.0       # fixed mode only: uniform DPI = 72 * scale.
  # Future ingests only — run tools/backfill_figure_dpi.py --native to lift an
  # existing bundle.

# Grobid (PDF metadata + reference parsing). Runs as a long-lived service
# next to the pipeline: Docker on a laptop (`docker compose up -d grobid`,
# see README §Grobid), Singularity on a cluster. Whichever it is, the
# $GROBID_URL environment variable overrides the `url:` below at run time —
# that is how HPC jobs reach a Grobid on a compute node whose hostname isn't
# known until submit time. `corpus run` and `corpus check` both honor it.
grobid:
  url: http://localhost:8070
  # disable: true   # skip Grobid even if reachable
  # Consolidation against CrossRef: 0 = off, 1 = look the record up.
  # consolidate_header: 1      # on by default; improves per-paper metadata
  # consolidate_citations: 0   # off by default, and that default is measured:
  #   across four documents and 194 references it recovered six DOIs for
  #   1.4-2x the Grobid time. Worth turning on for a library of modern papers
  #   whose references CrossRef actually holds; not for a historical one.

# Bibliography-build options.
bibliography:
  enrich_bhl: false   # opt-in BHL enrichment (slow, rate-limited)

# Figure-licensing policy (#51).
licensing:
  pd_cutoff_years: 95   # US copyright public-domain rule; configurable

# ---------------------------------------------------------------------------
# System tuning — leave unless you have a reason
# ---------------------------------------------------------------------------

ocr:
  optimize_level: 2

  # Re-OCR scanned pages even when they already carry a text layer.
  # Third-party OCR layers vary wildly in quality, and a bad one is
  # invisible downstream — it reads as clean text all the way into the
  # embeddings. A page is judged "scanned" by how much of it is raster
  # image, which is independent of what the text layer claims.
  # Set false to trust existing text layers (faster, and appropriate if
  # your PDFs come from a source whose OCR you vouch for).
  reocr_scanned_text_layers: true
  # Fraction of sampled pages that must be a full-page image before the
  # document counts as a scan. On the 32-paper reference corpus every
  # scan scored 0.50–1.00 and every born-digital paper exactly 0.00, so
  # 0.40 sits in a wide empty gap.
  scan_page_fraction_min: 0.40
  # Before OCRing a scan, OCR a 3-page sample to find out what language
  # it is actually in. The existing text layer can't answer that — it is
  # the thing we decided not to trust — and Tesseract's script detection
  # can't tell one Latin language from another. Without this probe such
  # documents OCR with every installed pack at once, which is the least
  # accurate setting Tesseract has. Costs ~3 pages of OCR per scan.
  probe_language_by_ocr: true
  # Minimum langdetect confidence before the probe's answer is used.
  # langdetect has no Latin profile, so Latin text can only come back as
  # a low-confidence Romance language — Linnaeus 1735 reads as Catalan at
  # 0.71, where every correct detection scores ~1.00. Below the floor the
  # document OCRs with the script's pack union, which includes `lat`.
  probe_language_min_confidence: 0.85
  # How many languages the probe may report for one document. Bilingual
  # originals-plus-translations are common in historical taxonomic
  # literature (a Russian paper with an English typescript from p. 8, a
  # French one with Pugh's translation stapled in), and both halves
  # should be OCR'd under the right model. Beyond ~3 a detection is more
  # likely noise than a genuinely polyglot volume.
  probe_max_languages: 3
  # A probe page whose OCR output scores above this much gibberish is
  # discarded rather than voted with: it means the page was OCR'd with
  # the wrong script's packs (Tesseract's script detection is not
  # infallible), and langdetect will confidently name a language for the
  # resulting garbage. Real pages in the reference corpus score
  # 0.12-0.39; a Cyrillic table transcribed with Latin packs scored 0.61.
  probe_max_gibberish: 0.50
  # Pages to OCR when probing. Sampled from the middle 15-85% of the
  # document: the front is covers, title pages and plates, the tail is
  # references — a multilingual pile of proper nouns and the worst
  # possible input to language detection.
  probe_sample_pages: 5
  # Render DPI for probe pages. 300, not 200: dropping to 200 to save
  # time measurably degraded detection — Kawamura 1911a lost its
  # Japanese entirely, Linnaeus 1735 went from correctly finding nothing
  # to a confident wrong `ca`, and Bernstein 1934 gained a spurious
  # `bg`. Language ID needs the OCR to be good enough to be a language.
  probe_dpi: 300
  # Tesseract traineddata codes used when language detection fails.
  ocr_languages_default:
    - eng
    - deu
    - deu_latf    # 19th-c. German Fraktur
    - fra
    - rus
    - lat
    - spa
    - por
    - chi_sim
    - chi_tra
    - jpn
    - ell
    - kor
  gibberish_threshold: 0.65
  # Per-page OCR timeout passed to ocrmypdf (--tesseract-timeout).
  # ocrmypdf's own default is far too tight for dense historical scans
  # with several language packs loaded, and when it fires the page is
  # copied into the output *blank* while ocrmypdf still exits 0 — the
  # loss is completely silent. Observed: Linnaeus 1735 lost 4 of 13
  # pages (56,631 chars -> 15,292) between two identical runs, purely on
  # machine load.
  tesseract_page_timeout: 900

chunking:
  max_tokens: 8191

stage_timeouts:
  # OCR's cap is max(ocr, ocr_per_page * pages * pack_factor), not the
  # flat `ocr` value — one document's runtime spans two orders of
  # magnitude here. Measured: 1.3 s/page with a single language pack,
  # 20 s/page with a seven-pack union. `ocr` is the floor that keeps a
  # small hung document failing fast; `ocr_per_page` is what lets a
  # 1,500-page monograph finish. On timeout the stage fails outright,
  # so both are deliberately generous.
  ocr: 1800
  ocr_per_page: 30
  grobid: 300
  docling: 600
  vision_pass: 600

huge_document:
  max_pages: 5000

quality_gates:
  empty_text_min_chars: 500
  min_chars_per_page: 200
  max_gibberish_score: 0.5
  zero_refs_min_pages: 5
  min_median_chunk_chars: 50
  min_figure_mean_intensity: 10
  max_figures_sampled: 50
