[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus"
description = "MCP server for taxonomic literature corpora"
readme = "README.md"
# Bounded deliberately (#163). environment.yaml pins python=3.12, all four
# CI tiers test 3.12 only, and the #98 known-good ML set (torch 2.12,
# transformers 5.8.1, docling 2.94.0) was verified against nothing else.
# An unbounded floor let pip attempt 3.13+ — reachable via INSTALL.md's
# pip-only path, where `python3 -m venv` increasingly means 3.13. Widen
# this only together with a 3.13 CI lane.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Casey Dunn" }]
dynamic = ["version"]

# Mirrors requirements.txt — keep in sync per CONTRIBUTING.md
# §"Dependencies — two files, on purpose". Native binaries
# (tesseract, ghostscript, pngquant) are install-platform's job.
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "numpy",
    "pillow",
    "matplotlib",
    "rapidfuzz>=2.0",
    "lxml",
    "rich",
    # Pinned exactly (#156): 2.0.0 removed `mcp.server.fastmcp`.
    "mcp==2.0.0",
    # Pinned (#158): CI's env cache never re-resolves these, so an
    # unpinned dep drifts invisibly until a clean install. `lancedb`
    # (#71) and `mcp` (#156) have each already broken one.
    "uvicorn==0.52.0",
    "lancedb==0.36.0",
    # Pinned known-good set (#98): docling 2.95/2.96 silently break macOS
    # arm64 (MPS) extraction. Keep in lockstep; advance deliberately.
    "sentence-transformers==5.5.0",
    "torch==2.12.0",
    "transformers==5.8.1",
    "anthropic==0.120.2",
    "docling==2.94.0",
    "ocrmypdf==17.8.1",
    "pymupdf",
    "langdetect==1.0.9",
    "pytesseract==0.3.13",
    "qwen-vl-utils==0.0.14",
    "accelerate==1.14.0",
]

# Not runtime deps (#162). These were in `dependencies`, so every install —
# including the AWS deploy host in DEPLOY.md — pulled a test runner, a
# linter, and a Jupyter kernel plus its ZeroMQ/Tornado stack. They stay
# unconditional in environment.yaml, which *is* the development
# environment (tests/test_no_undefined_names.py needs pyflakes on PATH
# there).
[project.optional-dependencies]
dev = [
    "pytest",
    "pyflakes",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/caseywdunn/corpus"
Issues = "https://github.com/caseywdunn/corpus/issues"
Changelog = "https://github.com/caseywdunn/corpus/blob/main/CHANGELOG.md"

[project.scripts]
corpus = "pipeline.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pipeline.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "mcpsrv*", "bib*"]
exclude = ["tests*", "deploy*", "tools*", "slurm*", "demo*", "templates*", "dev_docs*"]

[tool.setuptools.package-data]
mcpsrv = ["default_instructions.md"]
pipeline = ["config.template.yaml", "CITATION.cff"]
